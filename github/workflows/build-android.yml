
name: Build Ink and Garing Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract and locate Flutter project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*Flutter*Mobile*Source*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Flutter source ZIP not found."
            ls -la
            exit 1
          fi

          mkdir -p app
          unzip -q "$ZIP" -d app

          PUBSPEC="$(find app -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml was not found inside the ZIP."
            find app -maxdepth 4 -type f | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Flutter project at: $PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: ink-garing-android-apk
          path: app/**/build/app/outputs/flutter-apk/app-release.apk
