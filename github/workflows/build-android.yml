
name: Build Ink and Garing Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          mkdir app
          unzip -q Ink_and_Garing_Flutter_Mobile_App_Source.zip -d app
          ls -la app
          cd app/Ink_Garing_Flutter_Source
          flutter pub get

      - name: Build Android APK
        run: |
          cd app/Ink_Garing_Flutter_Source
          flutter build apk --release

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: ink-garing-android-apk
          path: app/Ink_Garing_Flutter_Source/build/app/outputs/flutter-apk/app-release.apk
